<!DOCTYPE html>
<html lang="en">
  <head>
    <!-- Page information and styles. -->
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="author" content="Nihal Chahal">
    <meta name="description" content="Styles the heading using typography, colors, dimensions, borders, padding, and margins.">
    <title>Introduction to CSS | Nihal Chahal</title>

    <style>

      h1 {
        /* typography */
        font-size: 100px;
        font-weight: 300;
        font-family: sans-serif;
        /* colors */
        color: black;
        background-color: pink;
        /* box model */
        width: 1138px;
        height: 300px;
        margin: 2px 2px 2px 2px;
        border: 2px solid black;
        padding: 2px 2px 2px 2px;
      }

    </style>
  </head>

  <body>
    <!-- Styles the heading using typography, colors, dimensions, borders, padding, and margins. -->
    <h1>Hello World Wide Web</h1>
  </body>
</html>
