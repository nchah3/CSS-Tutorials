<!DOCTYPE html>
<html lang="en">
  <head>
    <!-- Page information and styles. -->
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="author" content="Nihal Chahal">
    <meta name="description" content="Uses CSS shapes, gradients, shadows, and animation to draw a floating red balloon.">
    <title>CSS Art | Nihal Chahal</title>

    <style>
      /* Include padding and borders in element dimensions. */
        * { box-sizing: border-box; }
      
        /* Center the artwork horizontally and vertically using Flexbox. */
        body {
          display: flex;
          justify-content: center;
          align-items: center;
          min-height: 100vh;
          margin: 0;
        }
      
        /* Provide the circular background and positioning reference for the balloon. */
        .frame {
          position: relative;
          width: 500px;
          height: 500px;
          border: 1px dashed;
          border-radius: 50%;
          background: skyblue;
        }
        
        /* Draw and animate the balloon using rounded corners, a gradient, and shadows. */
        .red-balloon {
          position: absolute;
          left: 60px;
          width: 100px;
          height: 120px;
          background: radial-gradient(circle at 30% 30%, #fcc, #f00);
          border-radius: 50% 50% 51% 49% / 40% 40% 60% 60%;
          box-shadow: 0 8px 15px #0003,
            inset -5px -5px 8px #fff7;
          animation: float 4s ease-in-out infinite;
        }
        
        /* Draw the balloon string with a generated pseudo-element. */
        .red-balloon::after {
          content: "";
          display: block;
          width: 2px;
          height: 80px;
          background: black;
          transform: translate(49px, 120px);
        }
        
        /* Move the balloon down 20px and back during each animation cycle. */
        @keyframes float {
          0%   { transform: translateY(0); }
          50%  { transform: translateY(20px); }
          100% { transform: translateY(0); }
        }
    </style>
  </head>

  <body>
    <!-- Uses CSS shapes, gradients, shadows, and animation to draw a floating red balloon. -->
    <div class="frame">
      <div class="red-balloon"></div>
    </div>
  </body>
</html>
